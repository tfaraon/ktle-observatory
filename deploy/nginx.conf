# Reverse proxy nginx — a adapter dans /etc/nginx/sites-available/
server {
    listen 80;
    server_name lake-eyre.example.edu.au;

    # HTTPS : `sudo certbot --nginx` renseigne les lignes ssl_*
    # et ajoute la redirection depuis le port 80.

    # Acces restreint (superviseurs, jury) :
    #   sudo htpasswd -c /etc/nginx/.htpasswd lani
    # puis decommenter :
    # auth_basic "Lake Eyre observatory";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Premiere lecture d'un champ FLOW : laisser le temps au serveur
        proxy_read_timeout 180s;
    }

    # Les JSON du pipeline changent a chaque mise a jour
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}
